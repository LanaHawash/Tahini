<script>
    // عند النقر على عميل، يتم تعيين بريده الإلكتروني في الحقل الخاص
    function fillEmailField(email) {
        document.getElementById('notification-email').value = email;
        alert(`Email field filled with: ${email}`);
        // يمكن جعل قسم الإشعارات مرئيًا (إن كان مخفيًا)
        document.querySelector('.send-notifications').scrollIntoView({ behavior: 'smooth' });
    }

    // إرسال الإشعار
    function sendNotification() {
        const email = document.getElementById('notification-email').value;
        const message = document.getElementById('notification-message').value;

        if (!email) {
            alert('Please select a customer by clicking on their row.');
            return;
        }

        if (message.trim() === '') {
            alert('Please write a message before sending.');
            return;
        }

        // تنفيذ عملية الإرسال (يمكن استبدال هذا بمكالمة API لإرسال الإيميل)
        console.log(`Sending email to ${email} with message: ${message}`);
        alert(`Message sent to ${email}!`);

        // إعادة تعيين الحقول بعد الإرسال
        document.getElementById('notification-email').value = '';
        document.getElementById('notification-message').value = '';
    }
</script>
<script>
    // حذف العميل
    function deleteCustomer(customerId) {
        if (confirm("Are you sure you want to delete this customer?")) {
            const formData = new FormData();
            formData.append("action", "delete");
            formData.append("customer_id", customerId);

            fetch("", {
                method: "POST",
                body: formData,
            })
                .then((response) => response.text())
                .then((data) => {
                    alert(data);
                    location.reload();
                })
                .catch((error) => console.error("Error:", error));
        }
    }

    // جعل الصف قابلاً للتعديل
    // جعل الصف قابلاً للتعديل
    function editCustomer(row, customerId) {
        const cells = row.querySelectorAll("td");
        const editableFields = ["Customer_name", "Email", "Phone_number", "Registration_date", "City","Street"];

        if (row.isEditing) {
            // حفظ التعديلات
            const formData = new FormData();
            formData.append("action", "edit");
            formData.append("customer_id", customerId);

            editableFields.forEach((field, index) => {
                const cell = cells[index + 1]; // تجاوز العمود الأول (ID)
                const value = cell.querySelector("input").value;
                cell.innerText = value;  // تحديث النص في الخلية
                formData.append(field, value);  // إضافة القيمة المعدلة إلى البيانات المرسلة
            });

            // إرسال التعديل إلى الخادم
            fetch("", {
                method: "POST",
                body: formData,
            })
                .then((response) => response.text())
                .then((data) => {
                    alert(data);  // عرض رسالة التحقق
                    row.isEditing = false;  // إلغاء وضع التعديل
                })
                .catch((error) => console.error("Error:", error));
        } else {
            // تحويل الصف إلى قابل للتعديل
            editableFields.forEach((field, index) => {
                const cell = cells[index + 1]; // تجاوز العمود الأول (ID)
                const value = cell.innerText;
                cell.innerHTML = `<input type="text" style="width: 100px"  value="${value}" />`; // تحويل النص إلى حقل إدخال
            });

            row.isEditing = true;  // تفعيل وضع التعديل
        }
    }


</script>
