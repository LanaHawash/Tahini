<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".btn-action").forEach(function (button) {
      button.addEventListener("click", function () {
        const row = this.closest("tr");
        const orderId = row.querySelector("td:first-child").innerText;
        let status;

        if (this.classList.contains("btn-check")) {
          status = "Completed";
        } else if (this.classList.contains("btn-pend")) {
          status = "Pending";
        } else if (this.classList.contains("btn-cancel")) {
          status = "Cancelled";
        }

        if (status) {
          fetch("orders.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: `orderId=${orderId}&status=${status}`,
          })
                  .then((response) => response.json())
                  .then((data) => {
                    if (data.error) {
                      alert("Error: " + data.error);
                    } else {
                      // تحديث الصف بناءً على البيانات المسترجعة
                      const statusCell = row.querySelector(".status");
                      if (statusCell) {
                        statusCell.innerText = data.Status;
                        statusCell.className = `status ${data.Status.toLowerCase()}`;
                      }
                      row.querySelector("td:nth-child(3)").innerText = data.Products;
                      row.querySelector("td:nth-child(5)").innerText = `$${data.Total_amount}`;
                      alert("Order status updated successfully!");
                    }
                  })
                  .catch((error) => {
                    console.error("Error:", error);
                    alert("An error occurred while updating the status.");
                  });
        }
      });
    });
  });

  document.addEventListener("DOMContentLoaded", function () {
    const statusFilter = document.getElementById("status-filter");
    const applyFilterButton = document.querySelector(".btn-submit1");

    applyFilterButton.addEventListener("click", function () {
      const selectedStatus = statusFilter.value;
      const urlParams = new URLSearchParams(window.location.search);
      urlParams.set("status", selectedStatus); // تحديث الفلتر في الرابط
      window.location.search = urlParams.toString(); // إعادة تحميل الصفحة
    });
  });


</script>
